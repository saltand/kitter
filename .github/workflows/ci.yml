name: CI

on:
  pull_request:
  push:
    branches: [main, feat/mygo-native-macos]

jobs:
  native:
    name: Go + MyGo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Vet
        working-directory: native
        run: go vet ./...
      - name: Test
        working-directory: native
        run: go test -race -count=1 ./...
      - name: macOS cross-build
        working-directory: native
        run: GOOS=darwin GOARCH=arm64 go build ./...
      - name: mygo vet
        working-directory: native
        run: go tool mygo vet .
