name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            goarch: arm64
          - arch: x86_64
            os: macos-15-intel
            goarch: amd64
    runs-on: ${{ matrix.os }}
    env:
      KITTER_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - name: Install just
        run: brew install just
      - name: Verify tag matches app version
        shell: bash
        run: |
          app_version="$(sed -nE 's/.*"version": *"([^"]+)".*/\1/p' native/mygo.json | head -n 1)"
          test "$GITHUB_REF_NAME" = "v${app_version}"
      - name: Verify runner architecture
        run: test "$(uname -m)" = "$KITTER_ARCH"
      - name: Build desktop .app + dmg
        working-directory: native
        run: |
          go tool mygo build -platform "darwin/${{ matrix.goarch }}" -sign - -skip-notarize
      - name: Build standalone CLI
        working-directory: native
        run: |
          GOOS=darwin GOARCH=${{ matrix.goarch }} go build -o build/kitter ./cmd/kitter
          ./build/kitter --help >/dev/null
      - name: Rename dmg to the release artifact name
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="$(find native/build -name 'Kitter*.dmg' | head -n 1)"
          mv "$dmg" "native/build/Kitter-${version}-desktop-macos-${KITTER_ARCH}.dmg"
      - name: Package standalone CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_dir="native/build/kitter-cli-macos-${KITTER_ARCH}"
          archive="native/build/Kitter-${version}-cli-macos-${KITTER_ARCH}.tar.gz"
          mkdir -p "$package_dir"
          cp native/build/kitter LICENSE THIRD_PARTY_LICENSES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" .
          tar -tzf "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            native/build/Kitter-*-desktop-macos-${{ matrix.arch }}.dmg
            native/build/Kitter-*-cli-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Kitter $GITHUB_REF_NAME"
